name: Validate Terminal profile

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run profile validation tests
        run: python -m unittest discover -s tests -v