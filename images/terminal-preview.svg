  <rect y="36" width="112" height="36" fill="#66716d"/><rect x="112" y="36" width="112" height="36" fill="#b8443a"/><rect x="224" y="36" width="112" height="36" fill="#3a7d4a"/><rect x="336" y="36" width="112" height="36" fill="#8f6809"/><rect x="448" y="36" width="112" height="36" fill="#4a6e8e"/><rect x="560" y="36" width="112" height="36" fill="#8d5a80"/><rect x="672" y="36" width="112" height="36" fill="#367878"/><rect x="784" y="36" width="112" height="36" fill="#52635a"/>
