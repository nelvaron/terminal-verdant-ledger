<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Verdant Ledger Light — Apple Terminal preview</title>
<desc id="desc">A macOS Terminal-style window demonstrating the Verdant Ledger Light background, text styles, ANSI colors, zsh output, and Git status. All names and output are fictional.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9eee8"/><stop offset="1" stop-color="#dce7dd"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfcfa"/><stop offset="1" stop-color="#f3f7f3"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#334b3a" flood-opacity=".16"/></filter>
  <style>
    .mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:22px;fill:#1b2320}
    .small{font-size:18px}.prompt{fill:#2d7b46;font-weight:700}.green{fill:#2d6a3b}.red{fill:#b8443a}.ochre{fill:#8a6408}.blue{fill:#3d5f7a}.teal{fill:#2f6b6b}.plum{fill:#7a4a6e}.muted{fill:#66716d}.gray{fill:#5d6864}.bold{font-weight:700}.italic{font-style:italic}.link{fill:#376d9a}.rule{stroke:#cfd8d0;stroke-width:1.5}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#background)"/>
<rect x="44" y="34" width="1512" height="932" rx="22" fill="url(#panel)" stroke="#cbd7cd" filter="url(#shadow)"/>
<path d="M66 34h1468a22 22 0 0 1 22 22v35H44V56a22 22 0 0 1 22-22z" fill="#f8faf7" stroke="#cbd7cd"/>
<circle cx="73" cy="67" r="9" fill="#ff6058" stroke="#e14e47"/><circle cx="101" cy="67" r="9" fill="#ffbd2e" stroke="#d9a01f"/><circle cx="129" cy="67" r="9" fill="#28c840" stroke="#1da832"/>
<rect x="170" y="55" width="23" height="18" rx="3" fill="#496b71"/><path d="M174 51h8l3 4h-14z" fill="#496b71"/>
<text x="207" y="73" font-family="SF Pro Display,Arial,sans-serif" font-size="22" font-weight="600" fill="#33483c">~ — zsh</text>
