<!-- left main pane -->
<text x="72" y="138" class="mono"><tspan class="prompt">❯</tspan><tspan> echo "Verdant Ledger Light — Apple Terminal"</tspan></text>
<text x="72" y="170" class="mono">Verdant Ledger Light — Apple Terminal</text>
<text x="980" y="138" text-anchor="end" class="mono small muted">14:27</text>
<text x="72" y="215" class="mono"><tspan class="prompt">❯</tspan><tspan> printf 'Text styles: Normal Bold Dim Italic Underline'</tspan></text>
<text x="72" y="247" class="mono">Text styles: <tspan class="bold">Bold</tspan><tspan fill="#a2aaa5"> Dim </tspan><tspan class="italic">Italic</tspan><tspan text-decoration="underline"> Underline</tspan></text>
<text x="72" y="292" class="mono"><tspan class="prompt">❯</tspan><tspan> printf 'Status: Success Warning Info Error'</tspan></text>
<text x="72" y="324" class="mono">Status: <tspan class="green bold">Success</tspan><tspan class="ochre bold">  Warning</tspan><tspan class="blue bold">  Info</tspan><tspan class="red bold">  Error</tspan></text>
<text x="72" y="369" class="mono"><tspan class="prompt">❯</tspan><tspan> ./show-ansi-colors</tspan></text>
